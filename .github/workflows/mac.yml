name: macOS

# Wersja na macOS (katalog mac/). Osobny workflow, uruchamiany tylko przy zmianach w mac/,
# więc build Windows (ci.yml) zostaje bez zmian.
on:
  push:
    branches: ["**"]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-linux:
    # Logika (WaypointCore) nie zależy od AppKit — testy na Linuksie są szybkie i tanie.
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v7
      # Testy logiki + integracyjne na prawdziwych serwerach: OpenSSH (SFTP, bezpieczny zapis)
      # i vsftpd (FTP, FTPS jawne i niejawne) uruchamianych w kontenerze.
      - name: Testy WaypointCore (z serwerami SFTP i FTP)
        run: mac/scripts/core-integration-linux.sh

  app-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Wersja Swift / Xcode
        run: swift --version && xcodebuild -version && curl --version | head -1
      - name: Testy WaypointCore (macOS)
        run: swift test --package-path mac/WaypointCore
      - name: Budowa Waypoint.app
        env:
          VERSION: 0.1.0
          BUILD: ${{ github.run_number }}
        run: mac/scripts/bundle-app.sh
      - name: Paczka do pobrania
        uses: actions/upload-artifact@v7
        with:
          name: Waypoint-mac
          path: mac/dist/Waypoint-mac.zip
          retention-days: 14
      # Prawdziwe logowanie SSH z aplikacji (lokalny sshd, Pęk kluczy, pytanie o hasło) + zrzuty okna.
      - name: Test end-to-end (SSH)
        run: mac/scripts/smoke-test.sh
      - name: Zrzuty ekranu i logi testu
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Waypoint-mac-smoke
          path: mac/dist/smoke
          retention-days: 14
